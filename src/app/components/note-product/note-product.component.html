<nz-modal
      [nzVisible]="visible"
      [nzTitle]="title"
      nzCentered
      (nzOnCancel)="cancel()"
      (nzOnOk)="submit()"
      nzOkText="Xác Nhận"
      nzCancelText="Hủy"
      class="note-product"
    >
      <ng-container *nzModalContent>
        <p class="subtitle">{{product.name}} ({{product.size}})</p>
        <textarea
        nz-input
        placeholder="Thêm ghi chú..."
        [(ngModel)] = "product.note"
        [nzAutosize]="{ minRows: 6, maxRows: 6 }"
      ></textarea>
      <div class="group-qty" style="margin-top: 20px;">
        <span style="font-size: 16px;font-weight: 700;">Số lượng:</span>
        <input-quantity [quantity]="product.quantity||0" (onChange)="changeQuantity($event)" theme="dark"></input-quantity>
      </div>
      </ng-container>
    </nz-modal>
